<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Formulário de contato</title>

    <style>
        body{
            background-color: rgb(242, 184, 253);
            font-family: Arial, sans-serif;
        }

        h1{
            text-align: center;
            color: blueviolet;
        }       
        
        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
            color: #555;
        }

        button {
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #f0109a;
            color: white;
        }
    
    </style>
</head>
<body>
    <!--Adicione CSS para estilizar o formulário de contato feito no exemplo acima. 
    Adicione também mais um campo de texto de sua preferência (ex: telefone) e valide se o 
    campo está preenchido antes de enviar. Se não estiver, exiba uma mensagem de erro-->

    <h1>Formulário de Cadastro</h1>
    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required />
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" required />
        <br />

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" required />
        <br />

        <button type="submit">Enviar</button>
    </form>
    <p id="resultado"></p>
    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', (event) => {
            event.preventDefault(); // Impede o envio do formulário

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;

            if (nome && email && telefone) {
                resultado.textContent = `Cadastro realizado com sucesso! Nome: ${nome}, Email: ${email}, Telefone: ${telefone}`;
            } else {
                resultado.textContent = 'Por favor, preencha todos os campos.';
            }
        });
    </script>
</body>
</html>
