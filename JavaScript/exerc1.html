<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterando texto com DOM</title>
</head>
<body>
    <p id="texto">Lorem ipsum dolor sit amet consectetur adipisicing elit. 
    Vero magnam quia molestias nesciunt modi. Eum, officiis placeat voluptatum magni doloribus 
    odit eius in voluptas, velit quis aperiam iure temporibus dolorem.</p>
    
    <button id="botao"> Mudar Cor</button>

    <script>
        const botao = document.getElementById ('botao'); 
        const texto = document.getElementById ('texto');

        botao.addEventListener('click', () => {
            texto.style.color = 'blue';
        });
    </script>
</body>
</html>
