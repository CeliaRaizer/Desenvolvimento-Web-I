<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Modificando estilos com JavaScript</title>
</head>
<body>
    <!--Crie um botão que, quando clicado, altere a cor de fundo da página para uma cor 
    diferente (ex: azul claro), usando DOM e JavaScript.-->

    <p>Clique no botão para mudar a cor da página</p>
    <button id="botao">Mudar Cor</button>

    <script>
        const botao = document.getElementById('botao')

        botao.addEventListener('click', () =>{
            document.body.style.backgroundColor = 'lightblue'
        });
    </script>
</body>
</html>
